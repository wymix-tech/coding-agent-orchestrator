name: Release runtime packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate runtime manifest
        run: python scripts/build_release.py --check
      - name: Build runtime-only archives
        run: python scripts/build_release.py --version "${{ github.event.release.tag_name }}" --output dist
      - name: Upload runtime archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
