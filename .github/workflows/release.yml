name: Release runtime packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate runtime manifest
        run: python tools/release/build_release.py --check
      - name: Build runtime-only archives
        run: python tools/release/build_release.py --version="$RELEASE_TAG" --output dist
      - name: Upload runtime archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber -- "$RELEASE_TAG" dist/*.tar.gz dist/*.zip
