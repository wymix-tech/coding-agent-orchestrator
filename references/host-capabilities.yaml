version: 1
hosts:
  claude-code:
    session_context: true
    prompt_context: true
    pre_tool_block: true
    post_tool_feedback: true
    file_changed_observation: true
    stop_continue: true
    subagent_context: true
    subagent_stop_continue: true
    final_enforcement_strength: strong_runtime_plus_state_ci
  codex:
    session_context: true
    prompt_context: true
    pre_tool_block: true
    post_tool_feedback: true
    file_changed_observation: false
    stop_continue: true
    subagent_context: true
    subagent_stop_continue: true
    caveats:
      - specialized_tool_paths_may_bypass_default_tool_hooks
      - project_hooks_require_trust
    final_enforcement_strength: strong_runtime_plus_state_ci
  pi:
    session_context: true
    prompt_context: true
    dynamic_context: true
    pre_tool_block: true
    post_tool_feedback: true
    file_changed_observation: extension_defined
    stop_continue: best_effort_via_sendMessage
    subagent_context: extension_defined
    final_enforcement_strength: tool_runtime_plus_state_ci
principle: Host hooks are guardrails. Canonical state transition guards and CI remain the final enforcement boundary.
