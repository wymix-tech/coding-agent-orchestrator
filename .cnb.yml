$:
  vscode:
    - services:
        - vscode
      imports: https://cnb.cool/wymix.top/nav_sync/-/blob/main/env.prod.yml
      stages:
        - name: install pi
          script: curl -fsSL https://pi.dev/install.sh | sh
        - name: install pi env
          script: export PATH="/root/.pi/agent/bin:$PATH" && echo 'export PATH="/root/.pi/agent/bin:$PATH"' >> ~/.zshrc
        - name: install pi extentions
          script: export PATH="/root/.pi/agent/bin:$PATH" && pi install npm:pi-subagents && pi install npm:@juicesharp/rpiv-todo && pi install npm:@juicesharp/rpiv-ask-user-question
        - name: create demo source
          script: mkdir -p /tmp/demo_bak/.agents/skills/coding-agent-orchestrator
        - name: add create demo func
          script: |
            cat <<'EOF' >> ~/.zshrc

            # 创建 Coding Agent 测试项目
            create_agent_demo() {
              if [[ $# -ne 1 || -z "$1" ]]; then
                echo "用法: create_agent_demo <文件夹名称>"
                return 1
              fi
            
              local name="$1"
              local src="/tmp/demo_bak"
              local dest="/tmp/$name"
              local skills_dir="$dest/.agents/skills/coding-agent-orchestrator"

              if [[ ! -d "$src" ]]; then
                echo "错误: 源目录不存在: $src"
                return 1
              fi

              if [[ ! -d /workspace ]]; then
                echo "错误: 源目录不存在: /workspace"
                return 1
              fi

              if [[ -e "$dest" ]]; then
                echo "错误: 目标路径已存在: $dest"
                return 1
              fi

              cp -R "$src" "$dest" || return 1
              mkdir -p "$skills_dir" || return 1
              cp -R /workspace/. "$skills_dir/" || return 1
            
              echo "创建成功: $dest"
              echo "技能文件已复制到: $skills_dir"
            }
            EOF

# .cnb.yml
"**": # 匹配所有分支，任意分支 push 即同步
  push:
    - name: sync to github
      imports: https://cnb.cool/wymix.top/nav_sync/-/blob/main/env.prod.yml # 密钥仓库文件
      stages:
        - name: push code to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/wymix-tech/coding-agent-orchestrator.git
            auth_type: https
            username: $GITHUB_USERNAME
            password: $GITHUB_TOKEN
            push_tags: true # 同时同步标签