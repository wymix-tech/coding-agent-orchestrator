[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-orchestrator"
version = "0.1.0"
description = "Agent-neutral lightweight coding workflow control plane"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7", "tomli>=2.0.1; python_version < '3.11'"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]

[project.scripts]
cao = "scripts.cao:main"

[tool.setuptools]
packages = ["scripts"]

[tool.setuptools.data-files]
"share/coding-agent-orchestrator" = ["package.json", "SKILL.md", "cao"]
"share/coding-agent-orchestrator/templates" = ["templates/AGENTS.md", "templates/CLAUDE.md", "templates/pi-reviewer.md"]
"share/coding-agent-orchestrator/references" = ["references/*.md"]
"share/coding-agent-orchestrator/protocol" = ["protocol/*.json"]
# Host adapters and the shared hook bridge must ship with the package: without
# them `cao init` cannot wire any host, and no Session/Handoff/gate event is
# ever delivered.
"share/coding-agent-orchestrator/hooks" = ["hooks/host-event.sh"]
"share/coding-agent-orchestrator/hosts/claude-code" = ["hosts/claude-code/settings.fragment.json"]
"share/coding-agent-orchestrator/hosts/codex" = ["hosts/codex/hooks.json"]
"share/coding-agent-orchestrator/hosts/pi" = ["hosts/pi/coding-orchestrator.ts"]
"share/coding-agent-orchestrator/hosts/pi/internal" = ["hosts/pi/internal/*.ts"]

"share/coding-agent-orchestrator/templates/architecture" = ["templates/architecture/*.md"]

[tool.setuptools.package-data]
scripts = ["dashboard.html"]
